<style>
/* Idée : une colonne d'eau. Plus le score est haut, plus on plonge (barres du turquoise de surface au rose krill). Thème unique, océan de nuit. */
:root{
  --abyss:#04121f; --deep:#082a43; --mid:#0f4c6e; --foam:#eaf7f7; --mute:#8fb4c4;
  --krill:#ff6a57; --glow:#5ee6d8; --gold:#ffc857; --silver:#b8c9d6; --bronze:#d9955f;
  --line:rgba(160,220,235,.14); --card:rgba(10,45,70,.62); --card2:rgba(20,70,100,.55); --bad:#ff8a80;
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--abyss);-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--foam);min-height:100vh;background:linear-gradient(180deg,#0b4466 0,#082a43 260px,#04121f 720px) fixed,var(--abyss);padding-bottom:48px;overflow-x:hidden}
button,input,select{font-family:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgba(180,240,250,.28);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}
header{padding:calc(26px + env(safe-area-inset-top)) 0 14px}
.mark{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.5px;line-height:1.05;text-wrap:balance}
.mark b{color:var(--krill);font-weight:900}
.tag{margin-top:8px;color:var(--mute);font-size:14px;max-width:34ch;line-height:1.4}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:6px;margin:6px 0 14px;border-radius:16px;background:rgba(4,18,31,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
nav button{flex:1;padding:11px 2px;border:0;border-radius:11px;background:transparent;color:var(--mute);font-weight:700;font-size:13px}
nav button.on{background:var(--krill);color:#2a0b06}
nav button:focus-visible,.seg button:focus-visible,.chip:focus-visible,.cta:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(4,18,31,.55);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--mute);font-weight:700;font-size:14px}
.seg button.on{background:var(--card2);color:var(--foam);box-shadow:inset 0 0 0 1px var(--glow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--foam);font-size:13px;font-weight:600}
.chip small{color:var(--mute);font-weight:500;margin-left:4px}
.chip.on{background:var(--glow);border-color:var(--glow);color:#032421}
.chip.on small{color:#0a4d47}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.mute{color:var(--mute);font-size:13px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
/* sélecteur de jour, avatars */
.daypick{display:flex;gap:6px;margin-bottom:12px}
.daypick select{flex:1;font-weight:700;text-align:center;text-align-last:center}
.daypick button{width:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--foam);font-size:24px;line-height:1}
.daypick button:disabled{opacity:.3}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;color:#06202b;flex:0 0 auto}
.av.big{width:46px;height:46px;font-size:20px;margin-bottom:6px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.row.me{background:rgba(94,230,216,.08);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}
/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:4px 0 14px;min-height:210px}
.pcol{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.pname{font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-family:var(--display);font-weight:900;font-size:24px;margin:2px 0 6px}
.pscore small{font-size:11px;font-weight:600;color:var(--mute);margin-left:3px}
.pbar{width:100%;border-radius:14px 14px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--display);font-weight:900;font-size:22px;color:rgba(255,255,255,.9);background:linear-gradient(180deg,var(--c1),var(--c2))}
.p1{--c1:#ff8a6b;--c2:#c23a4f}
.p2{--c1:#6fb7d6;--c2:#14527a}
.p3{--c1:#4aa7a0;--c2:#0d4650}
.p1 .pscore{color:var(--gold)}
.crown{font-size:20px;line-height:1;margin-bottom:2px}
.mv{font-size:12px;font-weight:800}
.up{color:var(--glow)}.down{color:var(--bad)}.same{color:var(--mute)}
/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rk{font-family:var(--display);font-weight:900;font-size:18px;text-align:center;color:var(--mute)}
.rk.r1{color:var(--gold)}.rk.r2{color:var(--silver)}.rk.r3{color:var(--bronze)}
.who{min-width:0}
.who b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800}
.who b span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.track{height:7px;border-radius:5px;background:rgba(4,18,31,.7);margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--glow),#7fb2ff 55%,var(--krill))}
.score{text-align:right;font-family:var(--display);font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.score small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--mute)}
.del{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:4px 8px;font-size:12px}
.del.warn{border-color:var(--bad);color:var(--bad)}
/* dream team */
.dream{background:linear-gradient(135deg,rgba(255,106,87,.2),rgba(94,230,216,.14));border-color:rgba(255,200,87,.35)}
.dream h2{color:var(--gold)}
.big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--gold)}
.big small{font-size:14px;color:var(--mute);font-weight:600;margin-left:6px}
/* questions */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.qh{font-size:13px;color:var(--mute);margin-bottom:8px;line-height:1.4}
.qh b{font-family:var(--display);color:var(--krill);margin-right:6px}
.a{display:grid;grid-template-columns:24px auto 1fr auto;gap:8px;align-items:baseline;padding:4px 0;font-size:14px}
.a .nm{font-weight:800}
.a .an{color:var(--mute);min-width:0;overflow-wrap:anywhere}
.a .ap{font-weight:800}
.tier{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;letter-spacing:.3px;text-transform:uppercase}
.t0{background:#26425a;color:#c9dbe8}.t1{background:#2f4b63;color:#d3e3ee}.t2{background:#1f5a8c;color:#d6ebff}
.t3{background:#5a3a96;color:#eadfff}.t4{background:#a24a14;color:#ffe3cc}.t5{background:#9a7a10;color:#fff1b8}
.bests{display:grid;gap:6px;margin-top:12px;font-size:13px}
.bests div{display:flex;justify-content:space-between;gap:8px;color:var(--mute)}
.bests b{color:var(--foam)}
/* forms */
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(4,18,31,.7);color:var(--foam);font-size:16px;resize:vertical}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(4,18,31,.7);color:var(--foam);font-size:16px}
input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:1px}
input[type=file]{padding:10px}
.cta{width:100%;padding:14px;border:0;border-radius:14px;background:var(--krill);color:#2a0b06;font-weight:800;font-size:16px;margin-top:14px}
.cta:disabled{opacity:.5}
.ghost{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--foam);font-size:15px;font-weight:600;margin-top:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.thumbs img{height:96px;border-radius:10px;border:1px solid var(--line)}
.edit{border-top:1px solid var(--line);padding:12px 0}
.edit:first-of-type{border-top:0}
.edit .g{display:grid;grid-template-columns:1fr 84px;gap:6px;margin-top:6px}
.edit .g2{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.edit input,.edit select{padding:10px;font-size:15px}
.qn{font-family:var(--display);font-weight:700;color:var(--krill);font-size:12px}
.warn-t{color:var(--bad);font-size:13px;margin-top:10px;line-height:1.4}
.ok-t{color:var(--glow);font-size:13px;margin-top:10px;line-height:1.4}
.empty{text-align:center;padding:30px 12px}
.empty b.t{font-family:var(--display);font-size:18px;display:block;margin-bottom:8px}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35);margin-bottom:12px;font-size:13px;color:var(--gold)}
.demo button{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--mute);font-size:10px;font-family:var(--body)}
</style>
</head>

var cfg=loadCfg(),configured=!!(cfg.u&&cfg.k);
function loadCfg(){
  var c={u:(window.SUPABASE_URL||''),k:(window.SUPABASE_ANON_KEY||'')};
  if(c.u&&c.k)return c;
  var m=location.hash.match(/cfg=([^&]+)/);
  if(m){try{var o=JSON.parse(atob(decodeURIComponent(m[1])));if(o.u&&o.k){ls('kr_cfg',JSON.stringify(o));return {u:o.u,k:o.k}}}catch(e){}}
  var st=ls('kr_cfg');if(st){try{var o2=JSON.parse(st);if(o2.u&&o2.k)return {u:o2.u,k:o2.k}}catch(e){}}
  return c;
}
function cfgLink(u,k){return location.origin+location.pathname+'#cfg='+encodeURIComponent(btoa(JSON.stringify({u:u,k:k})))}

/* ---------- état ---------- */
var real={},demoOn=false,loaded=false,loadErr='',saving=false,refreshing=false;
var tab='day',ligueMode='total',selDate=null,pendingDel=null,draft=null,setup={u:'',k:'',link:''};
var COLORS=['#ff6a57','#5ee6d8','#ffc857','#7fb2ff','#d68bff','#8ee37f','#ff8fb8','#ffa94d','#6ee7ff','#c3d4e0'];
var TIER_PTS=[['raté',0],['one in a krillion',100],['deep cut',85],['deepcut',85],['rare',60],['schooler',30],['plankton',10]];
var TIERS=[['Raté',0],['Plankton',10],['Schooler',30],['Rare',60],['Deep Cut',85],['One in a Krillion',100]];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function keyOf(n){return String(parseInt(n,10)).padStart(4,'0')}
function numOf(k){return parseInt(k,10)}
function lastNum(){var d=allDates();return d.length?numOf(d[d.length-1]):0}
function tierPts(t){t=String(t||'').toLowerCase();for(var i=0;i<TIER_PTS.length;i++){if(t.indexOf(TIER_PTS[i][0])>=0)return TIER_PTS[i][1]}return null}
function tierCanon(t){var p=tierPts(t);if(p==null)return String(t||'');for(var i=0;i<TIERS.length;i++)if(TIERS[i][1]===p)return TIERS[i][0];return String(t||'')}
function tierCls(t){t=String(t||'').toLowerCase();if(t.indexOf('krillion')>=0)return 't5';if(t.indexOf('deep')>=0)return 't4';if(t.indexOf('rare')>=0&&t.indexOf('raté')<0)return 't3';if(t.indexOf('school')>=0)return 't2';if(t.indexOf('plank')>=0)return 't1';return 't0'}
function entryTotal(e){if(typeof e.total==='number')return e.total;var s=0;(e.answers||[]).forEach(function(a){if(a&&typeof a.points==='number')s+=a.points});return s}
function hasDetail(e){return (e.answers||[]).some(function(a){return a&&typeof a.points==='number'})}
function rareCount(e){var c=0;(e.answers||[]).forEach(function(a){if(a&&typeof a.points==='number'&&a.points>=60)c++});return c}
function rankBy(items,key){items.sort(function(a,b){return b[key]-a[key]||String(a.name).localeCompare(String(b.name))});var r=0;items.forEach(function(it,i){if(i===0||it[key]!==items[i-1][key])r=i+1;it.rank=r});return items}
function avatar(name,big){var h=0,n=String(name||'');for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return '<span class="av'+(big?' big':'')+'" style="background:'+COLORS[h%COLORS.length]+'">'+esc((n.trim()[0]||'?').toUpperCase())+'</span>'}
function isMe(n){var m=ls('kr_name').toLowerCase();return !!m&&String(n).toLowerCase()===m}
function rkCls(r){return r<=3?' r'+r:''}

/* ---------- exemple (non enregistré) ---------- */
function makeDemo(){
  var prompts=['Cite un biscuit ou un gâteau sec','Cite une ville d’Europe qui n’est pas une capitale','Cite un aliment venu des Amériques','Cite un phénomène du son','Cite une langue romane','Cite un mot du cyclisme sur route','Cite un film Pixar des années 2000'];
  var ans=[['Speculos','Oreo','Sablé','Cantuccini','Pizzelle'],['Barcelone','Dubrovnik','Bergen','Plovdiv','Tartu'],['Tomate','Maïs','Dinde','Topinambour','Physalis'],['Écho','Résonance','Infrason','Doppler','Battement'],['Français','Roumain','Occitan','Galicien','Sarde'],['Maillot','Pédale','Échappée','Lanterne rouge','Musette'],['Cars','Ratatouille','Wall-E','Monstres & Cie','Là-haut']];
  var names=['Matti','Tehei','Moana','Hina','Teva','Manu'],pts=[10,30,60,85,100],out={},seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  names.forEach(function(n,pi){
    var days={};
    ['0321','0322','0323'].forEach(function(d){
      if(pi===5&&d==='0321')return;
      var answers=prompts.map(function(p,q){
        var skill=0.35-pi*0.03+(n==='Matti'?0.12:0);
        var k=Math.min(4,Math.max(0,Math.floor((rnd()*0.75+skill*0.6)*5)));
        return {prompt:p,answer:ans[q][k],tier:TIERS[k+1][0],points:pts[k]};
      });
      days[d]={answers:answers,total:answers.reduce(function(s,a){return s+a.points},0)};
    });
    out['demo'+pi]={name:n,days:days};
  });
  return out;
}
var demoData=null;
function players(){if(hasReal())return real;if(demoOn){if(!demoData)demoData=makeDemo();return demoData}return {}}
function hasReal(){return Object.keys(real).length>0}

/* ---------- données (Supabase REST) ---------- */
async function api(path,opts){
  opts=opts||{};
  var h={apikey:cfg.k,'Content-Type':'application/json'};if(cfg.k.indexOf('eyJ')===0)h.Authorization='Bearer '+cfg.k;
  for(var k in (opts.headers||{}))h[k]=opts.headers[k];
  var r=await fetch(cfg.u.replace(/\/$/,'')+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body});
  var tx=await r.text();
  if(!r.ok)throw new Error(tx.slice(0,160)||('HTTP '+r.status));
  return tx?JSON.parse(tx):null;
}
async function loadAll(){
  var rows=await api('scores?select=player,num,answers,total,marks&order=num.asc&limit=5000');
  var p={};
  rows.forEach(function(r){
    var id=String(r.player).toLowerCase();
    if(!p[id])p[id]={name:r.player,days:{}};
    p[id].days[keyOf(r.num)]={answers:r.answers||[],total:r.total,marks:r.marks};
  });
  real=p;loaded=true;loadErr='';
}
async function refresh(force){
  if(!configured||refreshing)return;
  refreshing=true;
  try{await loadAll()}catch(e){if(!loaded)loadErr='Impossible de charger les scores : '+e.message}
  refreshing=false;
  var typing=document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(force||tab!=='add'||(!typing&&!saving))render();
}

/* ---------- calculs ---------- */
function allDates(){var s={},P=players();Object.keys(P).forEach(function(id){Object.keys(P[id].days||{}).forEach(function(k){s[k]=1})});return Object.keys(s).sort()}
function dayData(date){
  var P=players(),entries=[];
  Object.keys(P).forEach(function(id){var e=(P[id].days||{})[date];if(e)entries.push({id:id,name:P[id].name||'Joueur',entry:e,total:entryTotal(e)})});
  rankBy(entries,'total');
  var qs=[],ideal=0,detailed=entries.filter(function(en){return hasDetail(en.entry)}).length;
  for(var q=0;q<7;q++){
    var list=[],prompt='';
    entries.forEach(function(en){var a=(en.entry.answers||[])[q];if(a){if(!prompt&&a.prompt)prompt=a.prompt;if(typeof a.points==='number')list.push({name:en.name,answer:a.answer,tier:a.tier,points:a.points})}});
    list.sort(function(a,b){return b.points-a.points});
    var best=list.length?list[0].points:0;ideal+=best;
    qs.push({prompt:prompt,top:list.slice(0,3),best:best,bestName:list.length&&best>0?list[0].name:''});
  }
  return {entries:entries,qs:qs,ideal:ideal,detailed:detailed};
}
function statsUpTo(dates){
  var P=players(),rows={};
  Object.keys(P).forEach(function(id){rows[id]={id:id,name:P[id].name||'Joueur',total:0,n:0,best:0,cum:[]}});
  dates.forEach(function(d){
    Object.keys(rows).forEach(function(id){
      var e=(P[id].days||{})[d],r=rows[id];
      if(e){var t=entryTotal(e);r.total+=t;r.n++;if(t>r.best)r.best=t}
      r.cum.push(r.total);
    });
  });
  return Object.keys(rows).map(function(k){var r=rows[k];r.avg=r.n?Math.round(r.total/r.n):0;return r}).filter(function(r){return r.n>0});
}
function cumIdealSeries(dates){var c=0;return dates.map(function(d){c+=dayData(d).ideal;return c})}

/* ---------- composants ---------- */
function podiumHtml(items,key,unit){
  if(!items.length)return '';
  var top=items.slice(0,3),max=Math.max(top[0][key],1);
  var order=top.length>=3?[top[1],top[0],top[2]]:top.length===2?[top[1],top[0]]:[top[0]];
  var h='<div class="podium">';
  order.forEach(function(it){
    var cls='p'+Math.min(it.rank,3),ratio=Math.max(0.34,it[key]/max),barH=Math.round(34+ratio*96);
    h+='<div class="pcol '+cls+'">'+(it.rank===1?'<div class="crown" aria-hidden="true">👑</div>':'')+avatar(it.name,true)+'<div class="pname">'+esc(it.name)+'</div><div class="pscore num">'+it[key]+'<small>'+unit+'</small></div>'+movement(it)+'<div class="pbar" style="height:'+barH+'px">'+it.rank+'</div></div>';
  });
  return h+'</div>';
}
function movement(it){
  if(it.move==null)return it.isNew?'<div class="mv up">nouveau</div>':'<div class="mv same">&nbsp;</div>';
  if(it.move>0)return '<div class="mv up">▲ '+it.move+'</div>';
  if(it.move<0)return '<div class="mv down">▼ '+(-it.move)+'</div>';
  return '<div class="mv same">=</div>';
}
function rowHtml(it,key,ref,subtxt,unit,delKey){
  var pct=ref?Math.round(it[key]/ref*100):0;
  var del=delKey?'<button class="del'+(pendingDel===delKey?' warn':'')+'" data-del="'+esc(delKey)+'" aria-label="Supprimer ce score">'+(pendingDel===delKey?'Confirmer ?':'✕')+'</button>':'';
  var mv=(it.move!=null&&it.move!==0)?' <span class="mv '+(it.move>0?'up':'down')+'">'+(it.move>0?'▲':'▼')+Math.abs(it.move)+'</span>':'';
  return '<div class="row'+(isMe(it.name)?' me':'')+'"><div class="rk'+rkCls(it.rank)+'">'+it.rank+'</div><div class="who"><b>'+avatar(it.name)+'<span class="n">'+esc(it.name)+'</span>'+mv+'</b><div class="sub">'+subtxt+'</div><div class="track"><i style="width:'+pct+'%"></i></div></div><div class="score num"><span>'+it[key]+'<small>'+unit+'</small></span>'+del+'</div></div>';
}
function chipsHtml(dates){return '<div class="chips">'+dates.slice().reverse().map(function(d){return '<button class="chip'+(d===selDate?' on':'')+'" data-date="'+d+'">#'+numOf(d)+'</button>'}).join('')+'</div>'}
function demoBanner(){return (demoOn&&!hasReal())?'<div class="demo"><span>Exemple : ces scores ne sont pas enregistrés.</span><button data-act="demo-off">Quitter</button></div>':''}
function emptyHtml(){return '<div class="card empty"><b class="t">À l’eau !</b><div class="mute">Aucun score pour l’instant. Colle ton résultat dans <b>+ Ajouter</b> pour lancer la ligue.</div><button class="ghost" data-act="demo-on" style="max-width:260px;margin:16px auto 0">Voir un exemple</button></div>'}

function fixSel(dates){if(!selDate||dates.indexOf(selDate)<0)selDate=dates[dates.length-1]}
function dayPickerHtml(dates){

  return '<div class="daypick"><button data-nav="-1" aria-label="Plongée précédente"'+(i<=0?' disabled':'')+'>‹</button><select id="daysel" aria-label="Choisir la plongée">'+opts+'</select><button data-nav="1" aria-label="Plongée suivante"'+(i>=dates.length-1?' disabled':'')+'>›</button></div>';

function viewDay(){

  var h=demoBanner()+dayPickerHtml(dates);

    return rowHtml(en,'total',best,(hasDetail(en.entry)?(rc?rc+' réponse'+(rc>1?'s':'')+' rare'+(rc>1?'s':'')+' ou mieux':'aucune réponse rare'):'total seul'),'pts',(!demoOn||hasReal())?en.id+'|'+selDate:null)}).join('')+'</div></div>';
  if(dd.detailed>0)h+='<div class="card dream"><h2>Équipe idéale du jour</h2><div class="big num">'+dd.ideal+'<small>pts</small></div><p class="mute" style="margin-top:8px">La meilleure réponse de chaque question parmi les joueurs qui ont collé le détail ('+dd.detailed+' sur '+dd.entries.length+'). Meilleur score individuel : <b style="color:var(--foam)">'+best+'</b>.</p></div>';

function viewCum(){
  var dates=allDates();
  if(!dates.length)return emptyHtml();
  var h=demoBanner();
  var key=ligueMode==='avg'?'avg':'total',unit=ligueMode==='avg'?'moy.':'pts';
  var list=rankBy(statsUpTo(dates),key);
  if(dates.length>1){
    var prev=rankBy(statsUpTo(dates.slice(0,-1)),key),pm={};prev.forEach(function(p){pm[p.id]=p.rank});
    list.forEach(function(r){if(pm[r.id]!=null)r.move=pm[r.id]-r.rank;else r.isNew=true});
  }
  var topv=list.length?list[0][key]:1;
  h+='<div class="seg"><button data-lm="total" class="'+(ligueMode==='total'?'on':'')+'">Total cumulé</button><button data-lm="avg" class="'+(ligueMode==='avg'?'on':'')+'">Moyenne par jour</button></div>';
  h+='<div class="card">'+podiumHtml(list,key,unit)+'</div><div class="card"><h2>Tous les joueurs · '+dates.length+' plongée'+(dates.length>1?'s':'')+'</h2><div class="list">'+list.map(function(r){return rowHtml(r,key,topv,r.n+' plongée'+(r.n>1?'s':'')+' · moy. '+r.avg+' · record '+r.best,unit,null)}).join('')+'</div></div>';
  var cum=cumIdealSeries(dates);
  if(cum[cum.length-1]>0)h+='<div class="card dream"><h2>Équipe idéale cumulée</h2><div class="big num">'+cum[cum.length-1]+'<small>pts sur '+dates.length+' plongée'+(dates.length>1?'s':'')+'</small></div></div>';
  var svg=chartSvg(list,dates,cum);
  if(svg)h+='<div class="card"><h2>La plongée, jour après jour</h2>'+svg+'<div class="legend">'+list.map(function(r,i){return '<span><i style="background:'+COLORS[i%COLORS.length]+'"></i>'+esc(r.name)+'</span>'}).join('')+'<span><i style="background:#c3d4e0"></i>Équipe idéale</span></div></div>';
  return h;
}
function chartSvg(list,dates,cum){
  var W=360,H=220,pl=36,pr=10,pt=12,pb=24,n=dates.length;
  if(n<2)return '';
  var max=Math.max(cum[cum.length-1],list.reduce(function(m,r){return Math.max(m,r.cum[n-1])},0),1);
  function X(i){return pl+(W-pl-pr)*i/(n-1)}
  function Y(v){return pt+(H-pt-pb)*(1-v/max)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Évolution du total cumulé par joueur">';
  for(var g=0;g<=4;g++){var v=Math.round(max*g/4),y=Y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(160,220,235,.14)"/><text x="'+(pl-5)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>'}
  s+='<text x="'+pl+'" y="'+(H-7)+'">#'+numOf(dates[0])+'</text><text x="'+(W-pr)+'" y="'+(H-7)+'" text-anchor="end">#'+numOf(dates[n-1])+'</text>';
  if(cum[cum.length-1]>0)s+='<polyline fill="none" stroke="#c3d4e0" stroke-width="1.5" stroke-dasharray="4 4" points="'+cum.map(function(v,i){return X(i)+','+Y(v)}).join(' ')+'"/>';
  list.forEach(function(r,idx){
    var c=COLORS[idx%COLORS.length];
    s+='<polyline fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+r.cum.map(function(v,i){return X(i)+','+Y(v)}).join(' ')+'"/><circle cx="'+X(n-1)+'" cy="'+Y(r.cum[n-1])+'" r="3.5" fill="'+c+'"/>';
  });
  return s+'</svg>';
}

/* ---------- ajouter ---------- */
function newDraft(){var rows=[];for(var i=0;i<7;i++)rows.push({prompt:'',answer:'',tier:'',points:''});return {who:ls('kr_name'),num:'',paste:'',total:null,marks:null,rows:rows,showRows:false,status:'',statusKind:''}}
function draftSum(){var s=0;draft.rows.forEach(function(r){var p=parseInt(r.points,10);if(!isNaN(p))s+=p});return s}
function parsePage(t){
  var lines=String(t).split(/\r?\n/).map(function(x){return x.trim()}).filter(function(x){return x!==''});
  var pi=[];lines.forEach(function(l,i){if(/^\+\d{1,3}$/.test(l))pi.push(i)});
  if(pi.length<7)return null;
  pi=pi.slice(0,7);
  var rows=[];
  for(var k=0;k<7;k++){
    var p=pi[k],lo=k?pi[k-1]:-1,ti=-1;
    for(var j=p-1;j>lo;j--){if(/^[^\s\p{L}\p{N}]{1,2}\s+\S/u.test(lines[j])&&lines[j].length<40){ti=j;break}}
    if(ti<0)return null;
    var m=lines[ti].match(/^(\S+)\s+(.+)$/);
    rows.push({prompt:lines[ti-1]||'',answer:lines[ti-2]||'',tier:tierCanon(m[2].trim()),points:String(parseInt(lines[p].slice(1),10))});
  }
  return rows;
}
function parseShare(t){
  var out={num:null,total:null,marks:null},m=String(t).match(/#\s*(\d{1,5})/);if(m)out.num=parseInt(m[1],10);
  var s2=String(t).match(/(\d[\d\s  .,]*)\s*\/\s*700/);if(s2){var v=parseInt(s2[1].replace(/[^\d]/g,''),10);if(!isNaN(v)&&v<=700)out.total=v}
  String(t).split(/\r?\n/).forEach(function(line){var tk=line.trim().split(/\s+/);if(tk.length===7&&tk.every(function(x){return x.length<=2&&!/[\p{L}\p{N}]/u.test(x)}))out.marks=tk});
  return out;
}

  if(ln)h+='<div class="chips" style="padding:8px 0 0"><button class="chip" data-act="setnum" data-n="'+ln+'">#'+ln+'</button><button class="chip" data-act="setnum" data-n="'+(ln+1)+'">#'+(ln+1)+'</button></div>';
  h+='<div class="mute" style="margin-top:6px">Le numéro est dans le texte du bouton « Partager » (La Plongée du jour #…). Il se remplit tout seul si tu colles ce texte.</div></div>';
  h+='<div class="card"><h2>2 · Colle ton résultat</h2><div class="mute">Sur ta page de résultats, sélectionne tout le texte et copie-le : les 7 réponses, tiers et points sont lus tout seuls. Colle aussi le texte du bouton « Partager » pour le numéro. Le texte « Partager » seul donne le total.</div><label for="paste">Texte copié</label><textarea id="paste" rows="5" placeholder="Colle ici…">'+esc(draft.paste)+'</textarea><button class="ghost" id="readpaste">Lire le texte</button><button class="ghost" id="manual">Saisir à la main</button>';
  if(draft.status)h+='<div class="'+(draft.statusKind==='ok'?'ok-t':'warn-t')+'">'+esc(draft.status)+'</div>';
  if(draft.total!=null&&!draft.showRows)h+='<div class="ok-t">Lu : '+(draft.num?'plongée #'+esc(draft.num)+' · ':'')+draft.total+' pts (total seul)</div><button class="cta" data-act="save"'+(saving?' disabled':'')+'>'+(saving?'Enregistrement…':'Enregistrer ce score')+'</button>';
  h+='</div>';
  if(draft.showRows){
    h+='<div class="card"><h2>3 · Vérifie et enregistre</h2><div class="mute">Corrige si besoin avant d’enregistrer.</div>';
    draft.rows.forEach(function(r,i){
      var opts='<option value="">Tier…</option>'+TIERS.map(function(t){return '<option value="'+t[0]+'"'+(tierCanon(r.tier)===t[0]&&r.tier?' selected':'')+'>'+t[0]+' ('+t[1]+')</option>'}).join('')+'<option value="__o"'+(r.tier&&tierPts(r.tier)==null?' selected':'')+'>Autre</option>';
      h+='<div class="edit"><div class="qn">Q'+(i+1)+'</div><div class="g2"><input id="qp'+i+'" data-r="'+i+'" data-f="prompt" aria-label="Question '+(i+1)+'" placeholder="Question" value="'+esc(r.prompt)+'"></div><div class="g"><input id="qa'+i+'" data-r="'+i+'" data-f="answer" aria-label="Ta réponse '+(i+1)+'" placeholder="Ta réponse" value="'+esc(r.answer)+'"><input id="qs'+i+'" data-r="'+i+'" data-f="points" type="number" inputmode="numeric" aria-label="Points '+(i+1)+'" placeholder="Pts" value="'+esc(r.points)+'"></div><div class="g2"><select id="qt'+i+'" data-r="'+i+'" data-f="tiersel" aria-label="Tier '+(i+1)+'">'+opts+'</select></div></div>';
    });
    h+='<div class="row" style="grid-template-columns:1fr auto"><div class="who"><b>Total</b></div><div class="score num" id="dtotal">'+draftSum()+'</div></div>';
    h+='<button class="cta" data-act="save"'+(saving?' disabled':'')+'>'+(saving?'Enregistrement…':'Enregistrer ce score')+'</button></div>';
  }
  return h;
}
function setStatus(m,k){draft.status=m;draft.statusKind=k||'warn';render()}
async function doSave(){
  if(saving)return;
  var name=draft.who.trim().replace(/\s+/g,' ');
  if(!name){setStatus('Indique ton prénom.');return}
  var ex=real[name.toLowerCase()];if(ex)name=ex.name;
  if(ex&&ls('kr_name').toLowerCase()!==name.toLowerCase()&&!draft.confirmName){draft.askName=true;render();window.scrollTo(0,0);return}
  var nn=parseInt(draft.num,10);if(isNaN(nn)||nn<1){setStatus('Indique le numéro de la plongée.');return}
  var answers=draft.rows.map(function(r){var p=parseInt(r.points,10);return {prompt:String(r.prompt||'').slice(0,200),answer:String(r.answer||'').slice(0,120),tier:String(r.tier||'').slice(0,40),points:isNaN(p)?null:p}});
  var detail=answers.some(function(a){return typeof a.points==='number'}),total=detail?draftSum():draft.total;
  if(total==null){setStatus('Colle ton résultat ou renseigne les points.');return}
  var row={player:name,num:nn,answers:answers,total:total,marks:draft.marks||null};
  saving=true;render();
  try{
    await api('scores?on_conflict=player,num',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([row])});
    ls('kr_name',name);selDate=keyOf(nn);tab='day';var who=name;draft=newDraft();draft.who=who;
    await loadAll();
  }catch(e){saving=false;setStatus('Enregistrement impossible : '+e.message);return}
  saving=false;render();
}
async function doDelete(key){
  var i=key.indexOf('|'),id=key.slice(0,i),date=key.slice(i+1),p=real[id];if(!p)return;
  try{await api('scores?player=eq.'+encodeURIComponent(p.name)+'&num=eq.'+numOf(date),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadAll()}catch(e){loadErr='Suppression impossible : '+e.message}
  pendingDel=null;render();
}

/* ---------- configuration initiale ---------- */
function viewSetup(){
  var h='<div class="card"><h2>Première configuration</h2><div class="mute">Colle les deux informations de ta base Supabase (Project Settings, API). Tu obtiens ensuite un lien à envoyer à tes amis : ils n’ont rien à configurer.</div>'+
    '<label for="su">Project URL</label><input id="su" value="'+esc(setup.u)+'" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocomplete="off">'+
    '<label for="sk">Clé publique (« anon public » ou « Publishable »)</label><input id="sk" value="'+esc(setup.k)+'" placeholder="eyJ… ou sb_publishable_…" autocapitalize="off" autocomplete="off">'+
    '<button class="cta" data-act="mklink">Créer le lien de la ligue</button>';
  if(setup.err)h+='<div class="warn-t">'+esc(setup.err)+'</div>';
  if(setup.link)h+='<label for="sl">Lien à envoyer à tes amis</label><input id="sl" value="'+esc(setup.link)+'" readonly><button class="ghost" data-act="copylink">Copier le lien</button><a class="ghost" style="display:block;text-align:center;text-decoration:none" href="'+esc(setup.link)+'">Ouvrir la ligue</a><div class="mute" style="margin-top:8px">Ouvre toi-même ce lien, puis ajoute-le à l’écran d’accueil depuis le menu du navigateur.</div>';
  return h+'</div>';
}

/* ---------- rendu ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
  var v=$('#view');
  if(!configured){$('#nav').style.display='none';v.innerHTML=viewSetup();return}
  $('#nav').style.display='';
  if(loadErr&&!loaded){v.innerHTML='<div class="card empty mute">'+esc(loadErr)+'<br><br><button class="ghost" data-act="retry" style="max-width:220px;margin:0 auto">Réessayer</button></div>';return}
  if(!loaded){v.innerHTML='<div class="empty mute">Chargement des scores…</div>';return}
  var y=window.scrollY;
  v.innerHTML=(loadErr?'<div class="warn-t" style="margin-bottom:8px">'+esc(loadErr)+'</div>':'')+(tab==='day'?viewDay():tab==='cum'?viewCum():tab==='detail'?viewDetail():viewAdd());
  window.scrollTo(0,y);
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var d=t.dataset;
  if(d.tab){tab=d.tab;pendingDel=null;render();if(tab!=='add')refresh();return}
  if(d.nav){var ds=allDates(),ix=ds.indexOf(selDate)+parseInt(d.nav,10);if(ix>=0&&ix<ds.length){selDate=ds[ix];render()}return}
  if(d.lm){ligueMode=d.lm;render();return}
  if(d.date){selDate=d.date;pendingDel=null;render();return}
  if(d.act==='demo-on'){demoOn=true;render();return}
  if(d.act==='demo-off'){demoOn=false;render();return}
  if(d.act==='retry'){refresh(true);return}
  if(d.act==='save'){doSave();return}
  if(d.act==='same-yes'){draft.confirmName=true;draft.askName=false;doSave();return}
  if(d.act==='same-no'){draft.askName=false;draft.who='';draft.status='Choisis un autre nom, par exemple avec une initiale (Tehei M.).';draft.statusKind='warn';render();window.scrollTo(0,0);return}
  if(d.act==='setnum'){draft.num=d.n;render();return}
  if(d.act==='mklink'){
    var u=setup.u.trim(),k=setup.k.trim();
    if(!/^https:\/\/[^\s]+$/.test(u)||k.length<20){setup.err='Vérifie l’URL (https://…) et la clé.';render();return}
    setup.err='';setup.link=cfgLink(u,k);ls('kr_cfg',JSON.stringify({u:u,k:k}));render();return;
  }
  if(d.act==='copylink'){try{navigator.clipboard.writeText(setup.link);t.textContent='Lien copié ✓'}catch(er){var i=$('#sl');if(i){i.select();t.textContent='Sélectionné : copie-le'}}return}
  if(d.del){if(pendingDel===d.del)doDelete(d.del);else{pendingDel=d.del;render()}return}
  if(t.id==='manual'){draft.showRows=true;draft.status='';render();return}
  if(t.id==='readpaste'){
    var pg=parsePage(draft.paste),r=parseShare(draft.paste);
    if(pg){
      var sum=0;pg.forEach(function(x){sum+=parseInt(x.points,10)||0});
      draft.rows=pg;draft.showRows=true;draft.total=sum;draft.marks=r.marks;
      if(r.num!=null)draft.num=String(r.num);
      draft.status='Détail lu : 7 réponses, '+sum+' pts.'+(r.total!=null&&r.total!==sum?' Attention : le texte « Partager » indique '+r.total+'.':'')+(draft.num?'':' Indique le numéro de la plongée.');draft.statusKind=(r.total!=null&&r.total!==sum)?'warn':'ok';
    }else if(r.num==null&&r.total==null){draft.total=null;draft.status='Je ne trouve ni le détail ni le score. Colle le texte complet.';draft.statusKind='warn'}
    else{if(r.num!=null)draft.num=String(r.num);draft.total=r.total;draft.marks=r.marks;draft.status=r.total==null?'Score introuvable : colle aussi la page de résultats.':'';draft.statusKind='warn'}
    render();return;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='daysel'){selDate=t.value;pendingDel=null;render();return}
  if(t.dataset&&t.dataset.f==='tiersel'){var r=draft.rows[+t.dataset.r];if(t.value&&t.value!=='__o'){r.tier=t.value;r.points=String(tierPts(t.value))}else if(!t.value){r.tier=''}render()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='su'){setup.u=t.value;return}
  if(t.id==='sk'){setup.k=t.value;return}
  if(!draft)return;
  if(t.id==='who'){draft.who=t.value;draft.confirmName=false;draft.askName=false;return}
  if(t.id==='num'){draft.num=t.value;return}
  if(t.id==='paste'){draft.paste=t.value;return}
  if(t.dataset&&t.dataset.r!=null&&t.dataset.f!=='tiersel'){
    draft.rows[+t.dataset.r][t.dataset.f]=t.value;
    if(t.dataset.f==='points'){var d=$('#dtotal');if(d)d.textContent=draftSum()}
  }
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
setInterval(function(){if(!document.hidden)refresh()},25000);

/* manifeste (installation sur l'écran d'accueil) */
try{
  var icon=document.querySelector('link[rel=apple-touch-icon]').href;
  var mf={name:'Ligue Krillion',short_name:'Krillion',start_url:location.href,scope:location.origin+location.pathname.replace(/[^\/]*$/,''),display:'standalone',orientation:'portrait',background_color:'#04121f',theme_color:'#0a1c2e',lang:'fr',icons:[{src:window.__ICON192,sizes:'192x192',type:'image/png',purpose:'any'},{src:window.__ICON512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l);
}catch(e){}

render();
if(configured)refresh(true);
})();

</script>
</body>
</html>
