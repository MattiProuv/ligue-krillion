<style>
/* Idée : une colonne d'eau. Plus le score est haut, plus on plonge (barres du turquoise de surface au rose krill). Thème unique, océan de nuit. */
:root{
  --ink:4,18,31; --abyss:#04121f; --deep:#082a43; --mid:#0f4c6e; --foam:#eaf7f7; --mute:#8fb4c4;
  --krill:#ff6a57; --glow:#5ee6d8; --gold:#ffc857; --silver:#b8c9d6; --bronze:#d9955f;
  --line:rgba(160,220,235,.14); --card:rgba(10,45,70,.62); --card2:rgba(20,70,100,.55); --bad:#ff8a80;
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--abyss);-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--foam);min-height:100vh;background:linear-gradient(180deg,#0b4466 0,#082a43 260px,#04121f 720px) fixed,var(--abyss);padding-bottom:48px;overflow-x:hidden}
button,input,select{font-family:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgba(180,240,250,.28);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}
header{padding:calc(26px + env(safe-area-inset-top)) 0 14px}
.mark{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.5px;line-height:1.05;text-wrap:balance}
.mark b{color:var(--krill);font-weight:900}
.tag{margin-top:8px;color:var(--mute);font-size:14px;max-width:34ch;line-height:1.4}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:6px;margin:6px 0 14px;border-radius:16px;background:rgba(var(--ink),.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
nav button{flex:1;padding:11px 2px;border:0;border-radius:11px;background:transparent;color:var(--mute);font-weight:700;font-size:13px}
nav button.on{background:var(--krill);color:#2a0b06}
nav button:focus-visible,.seg button:focus-visible,.chip:focus-visible,.cta:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(var(--ink),.55);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--mute);font-weight:700;font-size:14px}
.seg button.on{background:var(--card2);color:var(--foam);box-shadow:inset 0 0 0 1px var(--glow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--foam);font-size:13px;font-weight:600}
.chip small{color:var(--mute);font-weight:500;margin-left:4px}
.chip.on{background:var(--glow);border-color:var(--glow);color:#032421}
.chip.on small{color:#0a4d47}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.mute{color:var(--mute);font-size:13px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;display:flex;gap:4px;z-index:6}
.lang button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--ink),.6);color:var(--mute);font-weight:800;font-size:12px;letter-spacing:.5px}
.lang button.on{background:var(--glow);border-color:var(--glow);color:#032421}
/* sélecteur de jour, avatars */
.daypick{display:flex;gap:6px;margin-bottom:12px}
.daypick select{flex:1;font-weight:700;text-align:center;text-align-last:center}
.daypick button{width:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--foam);font-size:24px;line-height:1}
.daypick button:disabled{opacity:.3}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;color:#06202b;flex:0 0 auto}
.av.big{color:#06202b;width:46px;height:46px;font-size:20px;margin-bottom:6px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.row.me{background:rgba(94,230,216,.08);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}

.seg.mini{margin-bottom:8px}.seg.mini button{padding:7px 6px;font-size:13px}
.seg button{font-size:13px}
.perlbl{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px}
.lnk{display:block;text-align:center;text-decoration:none;margin-top:10px}
.legend .lg{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--foam);font-size:12px;padding:4px 8px;border-radius:999px}
.legend .lg.on{border-color:var(--glow);background:rgba(94,230,216,.1)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes floaty{from{transform:translateY(0);opacity:0}15%{opacity:.5}to{transform:translateY(-110vh);opacity:0}}
@keyframes blink{50%{opacity:.25}}

function qsOf(ents){
  var qs=[],ideal=0;
  for(var q=0;q<7;q++){
    var list=[],prompt='';
    ents.forEach(function(en){var a=(en.entry.answers||[])[q];if(a){if(!prompt&&a.prompt)prompt=a.prompt;if(typeof a.points==='number')list.push({name:en.name,answer:a.answer,tier:a.tier,points:a.points})}});
    list.sort(function(a,b){return b.points-a.points});
    var best=list.length?list[0].points:0;ideal+=best;
    qs.push({prompt:prompt,top:list.slice(0,3),best:best,bestName:list.length&&best>0?list[0].name:''});
  }

}

function cowFor(name,nn,total,answers){
  var I=I18N[LANG],id=name.toLowerCase(),S=pStats(id);if(!S)return null;
  var key=keyOf(nn),dd=dayData(key),en=dd.entries,np=en.length,me=en.filter(function(x){return x.id===id||String(x.name).toLowerCase()===id})[0];
  var gs=0;en.forEach(function(x){gs+=x.total});var gavg=np?Math.round(gs/np):0;
  var zeros=answers.filter(function(a){return a.points===0}).length;
  var before=S.ds.filter(function(d){return d<key}),prevT=before.length?S.tot[S.ds.indexOf(before[before.length-1])]:null;
  var o={name:name,pts:total,zeros:zeros,gavg:gavg,d:prevT==null?0:Math.abs(total-prevT)},pool=null;
  if(total===69)pool=I.cw_69;else if(total===420)pool=I.cw_420;
  else if(S.n>=3&&S.worst.d===key&&S.worst.t===total)pool=I.cw_worst;
  else if(zeros>=3)pool=I.cw_zeros;
  else if(S.n>=3&&S.best.d===key&&S.best.t===total)pool=I.cw_record;
  else if(me&&np>=3&&me.rank===np)pool=I.cw_last;
  else if(prevT!=null&&prevT-total>=150)pool=I.cw_drop;
  else if(prevT!=null&&total-prevT>=150)pool=I.cw_jump;
  else if(S.n===1)pool=I.cw_first;
  else if(me&&np>=3&&me.rank===1)pool=I.cw_win;
  else if(gavg&&total<gavg*.6)pool=I.cw_low;
  if(partyOn()&&Math.random()<.5)pool=I.party_c;
  if(!pool)return null;
  return fillName(pickT(pool,Math.floor(Math.random()*1000)),o);
}

function newDraft(){var rows=[];for(var i=0;i<7;i++)rows.push({prompt:'',answer:'',tier:'',points:''});return {who:ls('kr_name'),num:'',paste:'',total:null,marks:null,rows:rows,showRows:false,status:'',statusKind:'',site:'auto'}}
function draftSum(){var s=0;draft.rows.forEach(function(r){var p=parseInt(r.points,10);if(!isNaN(p))s+=p});return s}
function parsePage(t){
  var lines=String(t).split(/\r?\n/).map(function(x){return x.trim()}).filter(function(x){return x!==''});
  var pi=[];lines.forEach(function(l,i){if(/^\+\d{1,3}$/.test(l))pi.push(i)});
  if(pi.length<7)return null;
  pi=pi.slice(0,7);
  var rows=[];
  for(var k=0;k<7;k++){
    var p=pi[k],lo=k?pi[k-1]:-1,ti=-1;
    for(var j=p-1;j>lo;j--){if(/^[^\s\p{L}\p{N}]{1,2}\s+\S/u.test(lines[j])&&lines[j].length<40){ti=j;break}}
    if(ti<0)return null;
    var m=lines[ti].match(/^(\S+)\s+(.+)$/);
    rows.push({prompt:lines[ti-1]||'',answer:lines[ti-2]||'',tier:tierCanon(m[2].trim()),points:String(parseInt(lines[p].slice(1),10))});
  }
  return rows;
}
function parseShare(t){
  var out={num:null,total:null,marks:null,site:null},m=String(t).match(/#\s*(\d{1,5})/),sm=String(t).match(/krillion\.(io|to)/i);if(sm)out.site=sm[1].toLowerCase();if(m)out.num=parseInt(m[1],10);
  var s2=String(t).match(/(\d[\d\s  .,]*)\s*\/\s*700/);if(s2){var v=parseInt(s2[1].replace(/[^\d]/g,''),10);if(!isNaN(v)&&v<=700)out.total=v}
  String(t).split(/\r?\n/).forEach(function(line){var tk=line.trim().split(/\s+/);if(tk.length===7&&tk.every(function(x){return x.length<=2&&!/[\p{L}\p{N}]/u.test(x)}))out.marks=tk});
  return out;
}

  if(t.id==='num'){draft.num=t.value;return}
  if(t.id==='paste'){draft.paste=t.value;return}
  if(t.dataset&&t.dataset.r!=null&&t.dataset.f!=='tiersel'){
    draft.rows[+t.dataset.r][t.dataset.f]=t.value;
    if(t.dataset.f==='points'){var d=$('#dtotal');if(d)d.textContent=draftSum()}
  }
});
