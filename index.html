<style>
/* Idée : une colonne d'eau. Plus le score est haut, plus on plonge (barres du turquoise de surface au rose krill). Thème unique, océan de nuit. */
:root{
  --ink:4,18,31; --abyss:#04121f; --deep:#082a43; --mid:#0f4c6e; --foam:#eaf7f7; --mute:#8fb4c4;
  --krill:#ff6a57; --glow:#5ee6d8; --gold:#ffc857; --silver:#b8c9d6; --bronze:#d9955f;
  --line:rgba(160,220,235,.14); --card:rgba(10,45,70,.62); --card2:rgba(20,70,100,.55); --bad:#ff8a80;
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--abyss);-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--foam);min-height:100vh;background:linear-gradient(180deg,#0b4466 0,#082a43 260px,#04121f 720px) fixed,var(--abyss);padding-bottom:48px;overflow-x:hidden}
button,input,select{font-family:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgba(180,240,250,.28);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px}
header{padding:calc(26px + env(safe-area-inset-top)) 0 14px}
.mark{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.5px;line-height:1.05;text-wrap:balance}
.mark b{color:var(--krill);font-weight:900}
.tag{margin-top:8px;color:var(--mute);font-size:14px;max-width:34ch;line-height:1.4}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:6px;margin:6px 0 14px;border-radius:16px;background:rgba(var(--ink),.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
nav button{flex:1;padding:11px 2px;border:0;border-radius:11px;background:transparent;color:var(--mute);font-weight:700;font-size:13px}
nav button.on{background:var(--krill);color:#2a0b06}
nav button:focus-visible,.seg button:focus-visible,.chip:focus-visible,.cta:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(var(--ink),.55);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--mute);font-weight:700;font-size:14px}
.seg button.on{background:var(--card2);color:var(--foam);box-shadow:inset 0 0 0 1px var(--glow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--foam);font-size:13px;font-weight:600}
.chip small{color:var(--mute);font-weight:500;margin-left:4px}
.chip.on{background:var(--glow);border-color:var(--glow);color:#032421}
.chip.on small{color:#0a4d47}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.mute{color:var(--mute);font-size:13px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;display:flex;gap:4px;z-index:6}
.lang button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--ink),.6);color:var(--mute);font-weight:800;font-size:12px;letter-spacing:.5px}
.lang button.on{background:var(--glow);border-color:var(--glow);color:#032421}
/* sélecteur de jour, avatars */
.daypick{display:flex;gap:6px;margin-bottom:12px}
.daypick select{flex:1;font-weight:700;text-align:center;text-align-last:center}
.daypick button{width:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--foam);font-size:24px;line-height:1}
.daypick button:disabled{opacity:.3}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;color:#06202b;flex:0 0 auto}
.av.big{color:#06202b;width:46px;height:46px;font-size:20px;margin-bottom:6px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.row.me{background:rgba(94,230,216,.08);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}

.seg.mini{margin-bottom:8px}.seg.mini button{padding:7px 6px;font-size:13px}
.seg button{font-size:13px}
.perlbl{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px}
.lnk{display:block;text-align:center;text-decoration:none;margin-top:10px}
.legend .lg{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--foam);font-size:12px;padding:4px 8px;border-radius:999px}
.legend .lg.on{border-color:var(--glow);background:rgba(94,230,216,.1)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes floaty{from{transform:translateY(0);opacity:0}15%{opacity:.5}to{transform:translateY(-110vh);opacity:0}}
@keyframes blink{50%{opacity:.25}}

s le charisme d’une notice de montage, avec moins de clarté.", "{name}, ta culture générale est un lieu mystérieux : personne n’y est jamais allé.", "Même l’IA qui lit tes réponses a besoin d’une pause.", "Ta curiosité ressemble à ta connexion en pleine campagne : intermittente et décevante.", "{name} réfléchit comme on conduit un chariot de supermarché : en rond, et en tapant dans tout.", "On dit que l’intelligence, c’est savoir douter. Toi tu doutes de rien, c’est ça qui est beau.", "Si ton cerveau était un restaurant, l’inspection du travail passerait."], "roast_last": ["Dernier du classement : on t’a gardé la meilleure place, tout au fond.", "Dernier sur {np}. Dans un vol, tu serais la valise perdue.", "Lanterne rouge : au moins, on te voit venir."], "roast_first": ["Premier ? Savoure, c’est la seule chose qui t’ait jamais obéi.", "En tête, mais on te surveille : trop de chance pour être honnête.", "Premier du classement et dernier de la modestie."], "roast_zero": ["{zeros} réponses à zéro. Ce n’est plus de la malchance, c’est un style.", "{zeros} zéros. Tu collectionnes les œufs sans jamais faire d’omelette."], "roast_wa": ["Ta pire réponse, « {wa} » : tu l’as sortie d’où, exactement ?", "« {wa} » ? J’espère que c’était une blague. Dis-moi que c’était une blague."], "roast_ba": ["Ta meilleure réponse, « {ba} », était un accident. Même une horloge arrêtée a raison deux fois par jour."], "roast_streak": ["{streak} jours d’affilée : plus d’assiduité que de talent, mais l’assiduité, ça compte."], "roast_rare": ["{p} % de réponses rares : l’imagination d’un parpaing, en plus lourd."], "site_l": "Tu joues sur quel site ?", "site_auto": "Auto (détecté)", "site_conv": "Plongée #{a} sur krillion.io (équivalent #{b} dans la ligue : même jour, même classement).", "sf_all": "Tous", "ds_to": "Questions .to (FR)", "ds_io": "Questions .io (EN)", "nav_chat": "Chat", "chat_h": "Le chat de la ligue : tout le monde peut y lire vos conneries.", "chat_empty": "Personne n’a encore p n average human.", "You took the shortest route. It was a dead end.", "Even a parrot would’ve varied it.", "Your answer is a junk drawer: everyone has one and nobody uses it.", "Bravo, you invented mental copy-paste.", "Smells like 3 a.m. thinking, minus the party.", "Somebody yelled “but obviously!” at their screen. It was you.", "In doubt you pick the obvious. In certainty too.", "Laziness has a face, and it just typed this.", "Did you think with your asshole or did you actually try?", "Brain.exe has stopped working.", "Even a corpse would’ve hesitated before answering that.", "The Nobel Prize in the Obvious goes to…", "Congrats, you just discovered that water is wet."], "flash": "BREAKING", "sh_btn": "📋 Share the ranking", "nudge_btn": "📣 Yell at the absentees", "copied": "Copied ✓", "sh_h": "🤿 KRILLION · dive #{n}", "nudge": "🤿 Dive #{n}: {names}, what the fuck are you waiting for?", "lvl": "Lv. {n}", "lvl_next": "{p} more pts to “{name}”", "lvl_max": "Max level. Go outside.", "ach_h": "Achievements · {a}/{b}", "fx_tap": "tap to close", "duel_v4": "{w} dismantled {l} by {d} pts. No lube.", "duel_v5": "{l} got humiliated by {w} ({d} pts). Take notes, asshole.", "tags": ["Prove you’re not as dumb as you look. (Spoiler: you are.)", "Losing is human. Losing constantly is commitment.", "Seven questions a day. Congrats, you’re still the dumbest fucker in the group chat.", "Your brain called. It wants a refund on your entire education.", "Fuck around and find out. Mostly the second part.", "You’re not stupid. You’re just consistently, impressively wrong.", "Dive deep. Embarrass yourself. Repeat until someone feels sorry for you.", "Nobody’s impressed. Nobody was ever going to be. Play anyway, you absolute legend (derogatory)."], "firstR": ["{name} wins with {pts} pts. Genius, luck, or a well-organized cheat.", "{name} on top ({pts} pts). Humility is about to take a hit.", "{pts} pts for {name}. The rest can go home.", "{name} dominates with {pts} pts. Unbearable, but deserved.", "Glory to {name} ({pts} pts). Statues arrive Monday.", "{name}: {pts} pts. The only one here who knows anything, apparently."], "lastR": ["{name} brings up the rear with {pts} pts. Rescue is on the way.", "{pts} pts for {name}. A score with the courage of its convictions: none.", "{name} dead last. Even the dunce cap refused to fit.", "{name} played. It’s the only thing we can say for them.", "RIP {name} ({pts} pts). A minute of silence, then we laugh.", "{name}: {pts} pts. Consistency in failure is a kind of talent.", "{name} finishes last with {pts} pts. They say it builds character. It needed it.", "Last, {name}? No, just keeping the spot warm for everyone else."], "absR": ["{names}: still nothing. The couch won.", "No score for {names}. Procrastination is a high-level sport.", "{names} are missing. Last known activity: making excuses.", "{names} didn’t play. Fear of losing or laziness? Both, probably."], "fxh": ["SUNK", "MEH", "NOT BAD", "RESPECT", "NAILED IT"], "fxq": [["Absolute dogshit. Respect for the consistency.", "What did you play with? Your balls?", "A dead catfish would do better.", "Vegetable score. Call your mom, she should know.", "You did that with your actual head? What's it for, then?", "Shame on you, your family and your ancestors."], ["Pathetic, but not enough to laugh at.", "Pub-quiz level after the 6th pint.", "Average. Like your sex life.", "You do mediocrity proud."], ["Respectable. You get a small candy, no more.", "Not bad for a human.", "Decent. Idiots still have hope."], ["Holy shit, do you read books in secret?", "Now we're talking. Got a PhD in uselessness?", "Respect, you bastard. Not bad at all."], ["Ok that's suspicious. You cheated, admit it.", "Abyss Brain unlocked. Everyone else can go home.", "God of Krillion. We already hate you."]], "lvls": ["Pubescent Plankton", "Mud Intern", "Catfish", "Barstool Shark", "Abyss Brain", "God of the Deep", "Legend (unbearable)"], "ach": [{"id": "first", "ic": "🩸", "n": "First blood" function makeDemo(){
  var prompts=LANG==='en'?['Name a cookie or biscuit','Name a European city that is not a capital','Name a food that came to Europe from the Americas','Name a sound phenomenon','Name a Romance language','Name a road cycling term','Name a Pixar feature from the 2000s']:['Cite un biscuit ou un gâteau sec','Cite une ville d’Europe qui n’est pas une capitale','Cite un aliment venu des Amériques','Cite un phénomène du son','Cite une langue romane','Cite un mot du cyclisme sur route','Cite un film Pixar des années 2000'];
  var ans=LANG==='en'?[['Speculoos','Oreo','Shortbread','Cantuccini','Pizzelle'],['Barcelona','Dubrovnik','Bergen','Plovdiv','Tartu'],['Tomato','Corn','Turkey','Jerusalem artichoke','Physalis'],['Echo','Resonance','Infrasound','Doppler','Beat'],['French','Romanian','Occitan','Galician','Sardinian'],['Jersey','Pedal','Breakaway','Lanterne rouge','Musette'],['Cars','Ratatouille','Wall-E','Monsters, Inc.','Up']]:[['Speculos','Oreo','Sablé','Cantuccini','Pizzelle'],['Barcelone','Dubrovnik','Bergen','Plovdiv','Tartu'],['Tomate','Maïs','Dinde','Topinambour','Physalis'],['Écho','Résonance','Infrason','Doppler','Battement'],['Français','Roumain','Occitan','Galicien','Sarde'],['Maillot','Pédale','Échappée','Lanterne rouge','Musette'],['Cars','Ratatouille','Wall-E','Monstres & Cie','Là-haut']];
  var names=['Matti','Tehei','Moana','Hina','Teva','Manu'],pts=[10,30,60,85,100],out={},seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  names.forEach(function(n,pi){
    var days={};
    ['0321','0322','0323'].forEach(function(d){
      if(pi===5&&d==='0321')return;
      var answers=prompts.map(function(p,q){
        var skill=0.35-pi*0.03+(n==='Matti'?0.12:0);
        var k=Math.min(4,Math.max(0,Math.floor((rnd()*0.75+skill*0.6)*5)));
        return {prompt:p,answer:ans[q][k],tier:TIERS[k+1][0],points:pts[k]};
      });
      days[d]={answers:answers,total:answers.reduce(function(s,a){return s+a.points},0)};
    });
    out['demo'+pi]={name:n,days:days};
  });
  return out;
}

/* ---------- données (Supabase REST) ---------- */
async function api(path,opts){
  opts=opts||{};
  var h={apikey:cfg.k,'Content-Type':'application/json'};if(cfg.k.indexOf('eyJ')===0)h.Authorization='Bearer '+cfg.k;
  for(var k in (opts.headers||{}))h[k]=opts.headers[k];
  var r=await fetch(cfg.u.replace(/\/$/,'')+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body});
  var tx=await r.text();
  if(!r.ok)throw new Error(tx.slice(0,160)||('HTTP '+r.status));
  return tx?JSON.parse(tx):null;
}
async function loadAll(){
  var rows;
  try{rows=await api('scores?select=player,num,answers,total,marks&order=num.asc&limit=5000');offline=false;try{ls('kr_cache',JSON.stringify(rows))}catch(e){}}
  catch(e){var c=ls('kr_cache');if(!c)throw e;try{rows=JSON.parse(c)}catch(e2){throw e}offline=true}
  var p={},pF={},M={react:[],cmt:[],chat:[],gage:{}},mx=todayNum()+1;
  rows.forEach(function(r){
    if(String(r.player).indexOf('__')===0){routeMeta(r,M);return}
    var id=String(r.player).toLowerCase(),tg=(r.num>mx||r.num<=IO_OFF)?pF:p;
    if(!tg[id])tg[id]={name:r.player,days:{}};
    tg[id].days[keyOf(r.num)]={answers:r.answers||[],total:r.total,marks:r.marks};
  });
  meta=M;real=p;realFut=pF;loaded=true;loadErr='';
}

/* ---------- calculs ---------- */
function allDates(){var s={},P=players();Object.keys(P).forEach(function(id){Object.keys(P[id].days||{}).forEach(function(k){s[k]=1})});return Object.keys(s).sort()}
function qsOf(ents){
  var qs=[],ideal=0;
  for(var q=0;q<7;q++){
    var list=[],prompt='';
    ents.forEach(function(en){var a=(en.entry.answers||[])[q];if(a){if(!prompt&&a.prompt)prompt=a.prompt;if(typeof a.points==='number')list.push({name:en.name,answer:a.answer,tier:a.tier,points:a.points})}});
    list.sort(function(a,b){return b.points-a.points});
    var best=list.length?list[0].points:0;ideal+=best;
    qs.push({prompt:prompt,top:list.slice(0,3),best:best,bestName:list.length&&best>0?list[0].name:''});
  }
  return {qs:qs,ideal:ideal};
}
function dayData(date,site){
  var P=players(),entries=[];
  Object.keys(P).forEach(function(id){var e=(P[id].days||{})[date];if(e)entries.push({id:id,name:P[id].name||T('player'),entry:e,total:entryTotal(e),site:siteOf(e)})});
  rankBy(entries,'total');
  var by={to:[],io:[]};entries.forEach(function(en){by[en.site==='io'?'io':'to'].push(en)});
  var A=qsOf(by.to),B=qsOf(by.io),dn={to:by.to.filter(function(x){return hasDetail(x.entry)}).length,io:by.io.filter(function(x){return hasDetail(x.entry)}).length};
  var use=site||(dn.io>dn.to?'io':'to'),U=use==='io'?B:A;
  return {entries:entries,qs:U.qs,ideal:A.ideal+B.ideal,idealSite:U.ideal,detailed:dn.to+dn.io,dn:dn,site:use};
}
function statsUpTo(dates){
  var P=players(),rows={};
  Object.keys(P).forEach(function(id){rows[id]={id:id,name:P[id].name||T('player'),total:0,n:0,best:0,cum:[]}});
  dates.forEach(function(d){
    Object.keys(rows).forEach(function(id){
      var e=(P[id].days||{})[d],r=rows[id];
      if(e){var t=entryTotal(e);r.total+=t;r.n++;if(t>r.best)r.best=t}
      r.cum.push(r.total);
    });
  });
  return Object.keys(rows).map(function(k){var r=rows[k];r.avg=r.n?Math.round(r.total/r.n):0;return r}).filter(function(r){return r.n>0});
}
function cumIdealSeries(dates){var c=0;return dates.map(function(d){c+=dayData(d).ideal;return c})}

function podiumHtml(items,key,unit){
  if(!items.length)return '';
  var top=items.slice(0,3),max=Math.max(top[0][key],1);
  var order=top.length>=3?[top[1],top[0],top[2]]:top.length===2?[top[1],top[0]]:[top[0]];
  var h='<div class="podium">';
  order.forEach(function(it){
    var cls='p'+Math.min(it.rank,3),ratio=Math.max(0.34,it[key]/max),barH=Math.round(34+ratio*96);
    h+='<div class="pcol '+cls+'">'+(it.rank===1?'<div class="crown" aria-hidden="true">👑</div>':'')+avatar(it.name,true)+'<div class="pname">'+esc(it.name)+'</div><div class="pscore num">'+it[key]+'<small>'+unit+'</small></div>'+movement(it)+'<div class="pbar" style="height:'+barH+'px">'+it.rank+'</div></div>';
  });
  return h+'</div>';
}
function movement(it){
  if(it.move==null)return it.isNew?'<div class="mv up">'+T('new')+'</div>':'<div class="mv same">&nbsp;</div>';
  if(it.move>0)return '<div class="mv up">▲ '+it.move+'</div>';
  if(it.move<0)return '<div class="mv down">▼ '+(-it.move)+'</div>';
  return '<div class="mv same">=</div>';
}
function rowHtml(it,key,ref,subtxt,unit,delKey,extra){
  var pct=ref?Math.round(it[key]/ref*100):0;
  var del=false?'<button class="del'+(pendingDel===delKey?' warn':'')+'" data-del="'+esc(delKey)+'" aria-label="'+T('del_aria')+'">'+(pendingDel===delKey?T('confirm'):'✕')+'</button>':'';
  var mv=(it.move!=null&&it.move!==0)?' <span class="mv '+(it.move>0?'up':'down')+'">'+(it.move>0?'▲':'▼')+Math.abs(it.move)+'</span>':'';
  return '<div class="row'+(isMe(it.name)?' me':'')+(it.last?' last':'')+'"><div class="rk'+rkCls(it.rank)+'">'+it.rank+'</div><div class="who"><b>'+avatar(it.name)+'<span class="n">'+esc(it.name)+'</span>'+mv+'</b><div class="subl"><div class="sub">'+subtxt+(it.last?' · <span class="shame">🐄 '+T('shame_tag')+'</span>':'')+'</div>'+(extra||'')+'</div><div class="track"><i style="width:'+pct+'%"></i></div></div><div class="score num"><span>'+it[key]+'<small>'+unit+'</small></span>'+del+'</div></div>';

function cowFor(name,nn,total,answers){
  var I=I18N[LANG],id=name.toLowerCase(),S=pStats(id);if(!S)return null;
  var key=keyOf(nn),dd=dayData(key),en=dd.entries,np=en.length,me=en.filter(function(x){return x.id===id||String(x.name).toLowerCase()===id})[0];
  var gs=0;en.forEach(function(x){gs+=x.total});var gavg=np?Math.round(gs/np):0;
  var zeros=answers.filter(function(a){return a.points===0}).length;
  var before=S.ds.filter(function(d){return d<key}),prevT=before.length?S.tot[S.ds.indexOf(before[before.length-1])]:null;
  var o={name:name,pts:total,zeros:zeros,gavg:gavg,d:prevT==null?0:Math.abs(total-prevT)},pool=null;
  if(total===69)pool=I.cw_69;else if(total===420)pool=I.cw_420;
  else if(S.n>=3&&S.worst.d===key&&S.worst.t===total)pool=I.cw_worst;
  else if(zeros>=3)pool=I.cw_zeros;
  else if(S.n>=3&&S.best.d===key&&S.best.t===total)pool=I.cw_record;
  else if(me&&np>=3&&me.rank===np)pool=I.cw_last;
  else if(prevT!=null&&prevT-total>=150)pool=I.cw_drop;
  else if(prevT!=null&&total-prevT>=150)pool=I.cw_jump;
  else if(S.n===1)pool=I.cw_first;
  else if(me&&np>=3&&me.rank===1)pool=I.cw_win;
  else if(gavg&&total<gavg*.6)pool=I.cw_low;
  if(partyOn()&&Math.random()<.5)pool=I.party_c;
  if(!pool)return null;
  return fillName(pickT(pool,Math.floor(Math.random()*1000)),o);
}

function trophies(){

  if(bestA)h+='<div class="q"><div class="qh">✨ '+T('brief_best')+'</div><div><b>'+esc(bestA.a.answer||'—')+'</b> · '+esc(bestA.a.name)+' · '+bestA.p+' '+T('pts')+'</div><div class="mute">'+esc(bestA.q.prompt||'')+'</div></div>';

function shameAnswers(){
  var P=players(),out=[];
  Object.keys(P).forEach(function(id){Object.keys(P[id].days||{}).forEach(function(d){(P[id].days[d].answers||[]).forEach(function(a){if(a&&typeof a.points==='number'&&a.points<=10&&a.answer)out.push({name:P[id].name,answer:a.answer,prompt:a.prompt,d:d,p:a.points,tier:a.tier})})})});
  out.sort(function(a,b){return a.p-b.p||(b.d<a.d?-1:b.d>a.d?1:0)});
  return out.slice(0,8);
}

function newDraft(){var rows=[];for(var i=0;i<7;i++)rows.push({prompt:'',answer:'',tier:'',points:''});return {who:ls('kr_name'),num:'',paste:'',total:null,marks:null,rows:rows,showRows:false,status:'',statusKind:'',site:'auto'}}
function draftSum(){var s=0;draft.rows.forEach(function(r){var p=parseInt(r.points,10);if(!isNaN(p))s+=p});return s}
function tierByPts(n){var t=TIERS[0][0];TIERS.forEach(function(x){if(n>=x[1])t=x[0]});return t}
function pageTotalIo(lines){
  for(var i=0;i<lines.length-1;i++){
    if(/^\d{1,3}$/.test(lines[i])){var m=lines[i+1].match(/^-?([\d,.\s]+)\s*m$/i);
      if(m){var dm=parseInt(m[1].replace(/\D/g,''),10),tv=parseInt(lines[i],10);if(dm===tv*10)return tv}}
  }
  return null;
}
var parseWhy=null;
function parsePageIo(lines){
  var rows=[];
  for(var i=0;i<lines.length&&rows.length<7;i++){
    if(!/(other players? chose this|autres? joueurs? (ont|a) choisi)/i.test(lines[i]))continue;
    var pt=lines[i+1];if(!/^\d{1,3}$/.test(pt||''))continue;
    var n=parseInt(pt,10),pr=lines[i-2]||'';
    if(pr===pr.toUpperCase()&&/[A-Z]/.test(pr))pr=pr.charAt(0)+pr.slice(1).toLowerCase();
    rows.push({prompt:pr,answer:lines[i-1]||'',tier:tierByPts(n),points:String(n)});
  }
  if(rows.length===7)return rows;
  /* secours : lecture par blocs 1..7 (réponse sans « other players », points absents en fin de texte) */
  var idx=[],from=0;
  for(var q=1;q<=7;q++){
    var f=-1;
    for(var j=from;j<lines.length-1;j++){if(lines[j]===String(q)&&!/^\d{1,3}$/.test(lines[j+1])&&lines[j+1].length>10){f=j;break}}
    if(f<0){parseWhy={k:'why_q',q:q,n:q-1};return null}idx.push(f);from=f+1;
  }
  var out=[],miss=[],sum=0;
  for(var k=0;k<7;k++){
    var bl=lines.slice(idx[k]+1,k<6?idx[k+1]:lines.length).filter(function(x){return x!=='+'});
    if(bl.length<2){parseWhy={k:'why_short',q:k+1};return null}
    var pr2=bl[0];if(pr2===pr2.toUpperCase()&&/[A-Z]/.test(pr2))pr2=pr2.charAt(0)+pr2.slice(1).toLowerCase();
    var ans=bl[1],pts=null,c=-1;
    for(var z=2;z<bl.length;z++){if(/(other players? chose this|autres? joueurs? (ont|a) choisi)/i.test(bl[z])){c=z;break}}
    if(c>=0){if(/^\d{1,3}$/.test(bl[c+1]||''))pts=parseInt(bl[c+1],10)}
    else if(/^\d{1,3}$/.test(bl[2]||''))pts=parseInt(bl[2],10);
    if(pts==null){miss.push(k)}else sum+=pts;
    out.push({prompt:pr2,answer:ans,tier:pts==null?'':tierByPts(pts),points:pts==null?'':String(pts)});
  }
  if(miss.length){
    var tt=pageTotalIo(lines);
    if(miss.length>1){parseWhy={k:'why_pts2',q:miss.map(function(x){return x+1}).join(', ')};return null}
    if(tt==null){parseWhy={k:'why_tot',q:miss[0]+1};return null}
    var v=tt-sum;if(v<0||v>100){parseWhy={k:'why_neg',q:miss[0]+1,t:tt};return null}
    out[miss[0]].points=String(v);out[miss[0]].tier=tierByPts(v);
  }
  return out;
}
function parsePage(t){
  var lines=String(t).split(/\r?\n/).map(function(x){return x.trim()}).filter(function(x){return x!==''});
  parseWhy=null;var io=parsePageIo(lines);if(io)return io;
  var why0=parseWhy,pi=[];lines.forEach(function(l,i){if(/^\+\d{1,3}$/.test(l))pi.push(i)});
  if(pi.length<7){if(!why0)parseWhy={k:'why_fmt'};return null}
  pi=pi.slice(0,7);
  var rows=[];
  for(var k=0;k<7;k++){
    var p=pi[k],lo=k?pi[k-1]:-1,ti=-1;
    for(var j=p-1;j>lo;j--){if(/^[^\s\p{L}\p{N}]{1,2}\s+\S/u.test(lines[j])&&lines[j].length<40){ti=j;break}}
    if(ti<0){if(!why0)parseWhy={k:'why_fmt'};return null}
    var m=lines[ti].match(/^(\S+)\s+(.+)$/);
    rows.push({prompt:lines[ti-1]||'',answer:lines[ti-2]||'',tier:tierCanon(m[2].trim()),points:String(parseInt(lines[p].slice(1),10))});
  }
  return rows;
}
function parseShare(t){
  var out={num:null,total:null,marks:null,site:null},m=String(t).match(/#\s*(\d{1,5})/),sm=String(t).match(/krillion\.(io|to)/i);if(sm)out.site=sm[1].toLowerCase();if(m)out.num=parseInt(m[1],10);
  if(/Dive\s*#\s*\d+\s*complete/i.test(t))out.site='io';else if(/Plong[ée]e\s*#\s*\d+/i.test(t))out.site='to';
  if(out.site==null&&/other players? chose this/i.test(t))out.site='io';
  var s2=String(t).match(/(\d[\d\s  .,]*)\s*\/\s*700/);if(s2){var v=parseInt(s2[1].replace(/[^\d]/g,''),10);if(!isNaN(v)&&v<=700)out.total=v}
  if(out.total==null){var s3=String(t).match(/complete\s*\r?\n\s*(\d{1,3})\s*\r?\n/i);if(s3&&parseInt(s3[1],10)<=700)out.total=parseInt(s3[1],10)}
  if(out.total==null){var pl0=String(t).split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean),pt0=pageTotalIo(pl0);if(pt0!=null)out.total=pt0}

  return out;
}

  if(d.rkm){rkMet=d.rkm;render();return}
  if(d.act==='introgo'){var ni=document.getElementById('intro-name'),nv=ni?ni.value.trim():'';if(nv){ls('kr_name',nv);if(draft&&!draft.who)draft.who=nv}ls('kr_intro','1');$('#intro').style.display='none';render();return}
  if(d.act==='intro'){showIntro();return}
  if(d.tab){tab=d.tab;pendingDel=null;if(tab==='players')plSel='';setMenu(false);render();if(tab!=='add')refresh();if(tab==='search')setTimeout(function(){var i=$('#srchq');if(i)i.focus()},60);return}
  if(d.act==='plback'){plSel='';render();return}
  if(d.act==='plshare'){var S1=pStats(plSel),nd=allDates(),rk1=rankBy(statsUpTo(nd),'total'),r1=0;rk1.forEach(function(r){if(r.id===plSel)r1=r.rank});var R1=ratingOf(S1,nd.length),lv=lvlOf(S1.sum);shareOut(T('pl_share_t',{name:S1.name,nick:nickOf(S1.name),ovr:R1.g,l:lv+1,rk:r1,np:rk1.length,sum:S1.sum,n:S1.n,v:pickT(I18N[LANG]['ovr'+ovrB(R1.g)],hsh(plSel))})+'\n'+location.href,t,T('copied'));return}
  if(d.nav){var ds=allDates(),ix=ds.indexOf(selDate)+parseInt(d.nav,10);if(ix>=0&&ix<ds.length){selDate=ds[ix];render()}return}
  if(d.act==='shareday'){shareOut(shareText(),t,T('copied'));return}
  if(d.act==='nudge'){shareOut(nudgeText(),t,T('copied'));return}
  if(d.rx!==undefined){addReaction(d.k,d.rx);return}
  if(d.rxo!==undefined){rxOpen=(rxOpen===d.rxo)?'':d.rxo;render();return}
  if(d.gage){var gp=d.gage.split('|');pickGage(+gp[0],+gp[1],gp.slice(2).join('|'));return}
  if(d.act==='chatsend'){sendChat();return}
  if(d.act==='roast'){var S0=pStats(plSel),rk0=rankBy(statsUpTo(allDates()),'total'),r0=0;rk0.forEach(function(r){if(r.id===plSel)r0=r.rank});roastOut[plSel]=roastFor(S0,r0,rk0.length);render();return}
  if(d.act==='roastshare'){shareOut(roastOut[plSel].join('\n\n'),t,T('copied'));return}
  if(d.act==='theme'){ls('kr_theme',ls('kr_theme')==='light'?'dark':'light');applyTheme();render();return}
  if(d.act==='snd'){ls('kr_snd',sndOn()?'0':'1');if(sndOn())playGood();render();return}
  if(d.act==='ics'){makeIcs(reminderT);return}
  if(d.act==='exp-csv'){exportCsv();return}
  if(d.act==='exp-json'){exportJson();return}
  if(d.act==='fixgo'){var cv=($('#fixcode')||{}).value||'';sha256(cv).then(function(hx){if(hx&&hx===FIXHASH){fixOk=true;fixMsg=''}else{fixMsg=T('fix_bad')}render()});return}
  if(d.act==='fixlock'){fixOk=false;fixMsg='';render();return}
  if(d.act==='fixedit'){var Pf=fixAll(),pf=Pf[fixSl.p],ef=pf&&pf.days[fixSl.d];if(!ef)return;var rows=[];for(var q=0;q<7;q++){var a=(ef.answers||[])[q]||{};rows.push({prompt:a.prompt||'',answer:a.answer||'',tier:a.tier||'',points:(typeof a.points==='number')?String(a.points):''})}
    draft=newDraft();draft.who=pf.name;draft.num=(dnum(fixSl.d)>=1&&numOf(fixSl.d)<=todayNum()+1)?String(dnum(fixSl.d)):'';draft.fixMode=true;draft.origName=pf.name;draft.origNum=numOf(fixSl.d);draft.rows=rows;draft.showRows=(ef.answers||[]).some(function(a){return a&&typeof a.points==='number'});draft.total=entryTotal(ef);draft.marks=ef.marks||null;draft.confirmName=true;draft.noConv=true;draft.site=siteOf(ef);draft.status=T('fix_loaded');draft.statusKind='ok';tab='add';render();window.scrollTo(0,0);return}
  if(d.act==='fixdel'){if(!fixConfirm){fixConfirm=true;render();return}fixConfirm=false;doDelete(fixSl.p+'|'+fixSl.d).then(function(){fixMsg=T('fix_deleted');render()});return}
  if(d.act==='anchor'){saveAnchor(parseInt(($('#anum')||{}).value,10),($('#adate')||{}).value||'');return}
  if(d.sf){siteF=d.sf;ls('kr_site',siteF);_pc.src=null;selDate=null;plSel='';duelSel='';render();return}
  if(d.ds){detSite=d.ds;render();return}
  if(d.lm){ligueMode=d.lm;perSel=null;render();return}
  if(d.cm){chartMode=d.cm;render();return}
  if(d.hl!==undefined){hl=(hl===d.hl)?'':d.hl;render();return}
  if(d.pl){plSel=d.pl;duelSel='';plTab='p';render();return}
  if(d.pn){var sz=perSize(),ix=[];allDates().forEach(function(x){var q=pidx(numOf(x),sz);if(ix.indexOf(q)<0)ix.push(q)});var k=ix.indexOf(perSel)+parseInt(d.pn,10);if(k>=0&&k<ix.length){perSel=ix[k];render()}return}

  if(d.date){selDate=d.date;pendingDel=null;render();return}
  if(d.act==='demo-on'){demoOn=true;render();return}
  if(d.act==='demo-off'){demoOn=false;render();return}
  if(d.act==='retry'){refresh(true);return}
  if(d.act==='save'){doSave();return}
  if(d.act==='same-yes'){draft.confirmName=true;draft.askName=false;doSave();return}
  if(d.act==='same-no'){draft.askName=false;draft.who='';draft.status=T('st_rename');draft.statusKind='warn';render();window.scrollTo(0,0);return}
  if(d.act==='setnum'){draft.num=d.n;render();return}
  if(d.act==='mklink'){
    var u=setup.u.trim(),k=setup.k.trim();
    if(!/^https:\/\/[^\s]+$/.test(u)||k.length<20){setup.err=T('su_err');render();return}
    setup.err='';setup.link=cfgLink(u,k);ls('kr_cfg',JSON.stringify({u:u,k:k}));render();return;
  }
  if(d.act==='copylink'){try{navigator.clipboard.writeText(setup.link);t.textContent=T('lk_copied')}catch(er){var i=$('#sl');if(i){i.select();t.textContent=T('lk_sel')}}return}
  if(t.id==='manual'){draft.showRows=true;draft.status='';render();return}
  if(t.id==='readpaste'){
    var pg=parsePage(draft.paste),r=parseShare(draft.paste),dc=dayCheck(r);
    if(r.site)draft.site=r.site;
    if(dc){draft.total=null;draft.showRows=false;draft.marks=null;draft.status=dc;draft.statusKind='warn';render();return}
    if(fixOk&&r.num!=null){var rn=(r.site==='to')?r.num-IO_OFF:r.num;if(rn>0)draft.num=String(rn)}
    if(pg){
      var sum=0;pg.forEach(function(x){sum+=parseInt(x.points,10)||0});
      draft.rows=pg;draft.showRows=true;draft.total=sum;draft.marks=r.marks;
      draft.status=T('st_detail',{s:sum})+(r.total!=null&&r.total!==sum?' '+T('st_warn',{t:r.total}):'');draft.statusKind=(r.total!=null&&r.total!==sum)?'warn':'ok';
    }else if(r.num==null&&r.total==null){draft.total=null;draft.status=T('st_none')+(parseWhy?' '+T(parseWhy.k,parseWhy):'');draft.statusKind='warn'}
    else{draft.total=r.total;draft.marks=r.marks;draft.status=(r.total==null?T('st_noscore'):T('why_head',{t:r.total}))+(parseWhy?' '+T(parseWhy.k,parseWhy):'');draft.statusKind='warn'}
    render();return;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='daysel'){selDate=t.value;pendingDel=null;render();return}
  if(t.id==='site'&&draft){draft.site=t.value;render();return}
  if(t.id==='duelsel'){duelSel=t.value;render();return}
  if(t.id==='h2a'){h2hA=t.value;if(h2hB===h2hA)h2hB='';h2hRoll=0;render();return}
  if(t.id==='h2b'){h2hB=t.value;if(h2hA===h2hB)h2hA='';h2hRoll=0;render();return}
  if(t.id==='fixp'){fixSl.p=t.value;fixSl.d='';fixConfirm=false;render();return}
  if(t.id==='fixd'){fixSl.d=t.value;fixConfirm=false;render();return}
  if(t.dataset&&t.dataset.f==='tiersel'){var r=draft.rows[+t.dataset.r];if(t.value&&t.value!=='__o'){r.tier=t.value;r.points=String(tierPts(t.value))}else if(!t.value){r.tier=''}render()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='su'){setup.u=t.value;return}
  if(t.id==='sk'){setup.k=t.value;return}
  if(t.id==='srchq'){srchQ=t.value;var re=$('#srchres');if(re)re.innerHTML=searchRes();return}
  if(t.id==='chatby'){chatD.by=t.value;return}
  if(t.id==='chattext'){chatD.text=t.value;return}
  if(t.id==='remt'){reminderT=t.value||'20:00';return}
  if(!draft)return;
  if(t.id==='who'){draft.who=t.value;draft.confirmName=false;draft.askName=false;return}
  if(t.id==='num'){draft.num=t.value;var pv=$('#numprev');if(pv)pv.innerHTML=numPrev();return}
  if(t.id==='paste'){draft.paste=t.value;return}
  if(t.dataset&&t.dataset.r!=null&&t.dataset.f!=='tiersel'){
    draft.rows[+t.dataset.r][t.dataset.f]=t.value;
    if(t.dataset.f==='points'){var d=$('#dtotal');if(d)d.textContent=draftSum()}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='chattext'){e.preventDefault();sendChat()}});
setInterval(function(){if(!document.hidden&&tab==='chat')refresh()},7000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
setInterval(function(){if(!document.hidden)refresh()},25000);

/* manifeste (installation sur l'écran d'accueil) */
try{
  var icon=document.querySelector('link[rel=apple-touch-icon]').href;
  var mf={name:T('app_name'),short_name:'Krillion',start_url:location.href,scope:location.origin+location.pathname.replace(/[^\/]*$/,''),display:'standalone',orientation:'portrait',background_color:'#04121f',theme_color:'#0a1c2e',lang:LANG,icons:[{src:window.__ICON192,sizes:'192x192',type:'image/png',purpose:'any'},{src:window.__ICON512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l);
}catch(e){}

applyTheme();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
applyStatic();
render();
if(configured&&!ls('kr_intro'))showIntro();
if(configured)refresh(true);
})();
